<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="theme-color" content="#070a16" />
        <title>Offline | EM Development</title>
        <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; align-items: center; justify-content: center; padding: 24px; background: #070a16; color: #e5e9ff; font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
    .card { max-width: 380px; width: 100%; text-align: center; padding: 36px 28px; border-radius: 28px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09); }
    .logo { width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 26px; color: #fff; background: linear-gradient(135deg, #5b6cff, #22d3ee); }
    h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: -.01em; }
    p { margin: 0 0 24px; color: #a9b2e6; line-height: 1.55; font-size: 15px; }
    button { width: 100%; padding: 14px; border: 0; border-radius: 12px; cursor: pointer; color: #fff; font: 700 15px/1 inherit; background: linear-gradient(90deg, #5b6cff, #4351e8); }
    button:focus-visible { outline: 3px solid rgba(124,140,255,.5); outline-offset: 2px; }
  </style>
    </head>
    <body>
        <main class="card">
            <div class="logo">E</div>
            <h1>You're offline</h1>
            <p>We can't reach the server right now. Check your connection and
                try again. Pages you've already opened may still be
                available.</p>
            <button type="button" onclick="location.reload()">Try again</button>
        </main>
        <script>
    addEventListener('online', function () { location.reload(); });
  </script>
    </body>
</html>
